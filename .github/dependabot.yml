version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # The starter compiles against the oldest Spring Boot it supports; a minor or major bump would raise that floor.
    # Patch releases of 3.5 still come through.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-dependencies
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
